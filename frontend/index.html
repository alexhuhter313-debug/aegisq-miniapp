<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AEGISQ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #0a0e17; --card: #111827; --accent: #00f0ff; --danger: #ff3355; --success: #00ff88; --warn: #ffaa00; --text: #e2e8f0; --muted: #64748b; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 12px; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .logo { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--accent), #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: rgba(0,255,136,0.15); color: var(--success); border: 1px solid rgba(0,255,136,0.3); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .stat-card { background: var(--card); border-radius: 12px; padding: 14px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 24px; font-weight: 700; margin-top: 4px; }
        .stat-value.green { color: var(--success); }
        .stat-value.red { color: var(--danger); }
        .stat-value.cyan { color: var(--accent); }
        .stat-value.yellow { color: var(--warn); }
        .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 10px; }
        .module-list { display: flex; flex-direction: column; gap: 8px; }
        .module-item { background: var(--card); border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.04); }
        .module-name { font-size: 14px; font-weight: 500; }
        .module-status { font-size: 11px; padding: 3px 8px; border-radius: 12px; }
        .module-status.active { background: rgba(0,255,136,0.12); color: var(--success); }
        .module-status.idle { background: rgba(100,116,139,0.15); color: var(--muted); }
        .module-status.alert { background: rgba(255,51,85,0.12); color: var(--danger); }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-around; padding: 8px 0 12px; }
        .nav-item { text-align: center; font-size: 10px; color: var(--muted); cursor: pointer; padding: 4px 12px; border-radius: 8px; }
        .nav-item.active { color: var(--accent); }
        .nav-item .icon { font-size: 20px; display: block; margin-bottom: 2px; }
        .content { padding-bottom: 70px; }
        .log-entry { background: var(--card); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; font-family: monospace; font-size: 12px; border-left: 3px solid var(--accent); }
        .log-entry.danger { border-left-color: var(--danger); }
        .log-entry.warn { border-left-color: var(--warn); }
        .log-time { color: var(--muted); font-size: 10px; }
        .btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; width: 100%; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .hidden { display: none; }
        .scan-result { background: var(--card); border-radius: 10px; padding: 14px; margin-bottom: 8px; }
        .scan-result .title { font-weight: 600; margin-bottom: 4px; }
        .scan-result .detail { font-size: 12px; color: var(--muted); }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">◆ AEGISQ</div>
        <div class="status-badge" id="statusBadge">● ONLINE</div>
    </div>
    <div class="content" id="content">
        <div id="page-dashboard">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-label">Modules Active</div><div class="stat-value cyan" id="modulesActive">0</div></div>
                <div class="stat-card"><div class="stat-label">Threats Today</div><div class="stat-value red" id="threatsToday">0</div></div>
                <div class="stat-card"><div class="stat-label">Scans Run</div><div class="stat-value green" id="scansRun">0</div></div>
                <div class="stat-card"><div class="stat-label">Uptime</div><div class="stat-value yellow" id="uptime">--</div></div>
            </div>
            <div class="section-title">Active Modules</div>
            <div class="module-list" id="moduleList"><div class="module-item"><span class="module-name">Loading...</span></div></div>
            <div class="section-title">Recent Alerts</div>
            <div id="alertList"></div>
        </div>
        <div id="page-scanner" class="hidden">
            <div class="section-title">Quick Scan</div>
            <button class="btn" onclick="runScan('quick')">▶ Run Quick Scan</button>
            <div style="height:10px"></div>
            <button class="btn btn-outline" onclick="runScan('full')">▶ Run Full Scan</button>
            <div style="height:10px"></div>
            <button class="btn btn-outline" onclick="runScan('network')">▶ Network Sweep</button>
            <div class="section-title" style="margin-top:20px">Last Results</div>
            <div id="scanResults"></div>
        </div>
        <div id="page-logs" class="hidden">
            <div class="section-title">Live Logs</div>
            <div id="logContainer"></div>
        </div>
        <div id="page-config" class="hidden">
            <div class="section-title">Module Toggle</div>
            <div id="configModules"></div>
            <div style="height:16px"></div>
            <div class="section-title">Actions</div>
            <button class="btn btn-danger" onclick="restartBackend()">⟳ Restart Backend</button>
        </div>
    </div>
    <div class="nav-bar">
        <div class="nav-item active" data-page="dashboard" onclick="switchPage('dashboard')"><span class="icon">◈</span> Dashboard</div>
        <div class="nav-item" data-page="scanner" onclick="switchPage('scanner')"><span class="icon">○</span> Scanner</div>
        <div class="nav-item" data-page="logs" onclick="switchPage('logs')"><span class="icon">☰</span> Logs</div>
        <div class="nav-item" data-page="config" onclick="switchPage('config')"><span class="icon">⚙</span> Config</div>
    </div>
    <script>
        const API = window.location.origin;
        let ws = null;
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        function switchPage(p) {
            document.querySelectorAll('.content>div').forEach(d=>d.classList.add('hidden'));
            document.getElementById('page-'+p).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
            document.querySelector('[data-page="'+p+'"]').classList.add('active');
        }
        function connectWS() {
            const proto = location.protocol==='https:'?'wss:':'ws:';
            ws = new WebSocket(proto+'//'+location.host+'/ws');
            ws.onmessage = e => {
                const d = JSON.parse(e.data);
                if(d.type==='stats') updateStats(d);
                if(d.type==='alert') addAlert(d);
                if(d.type==='log') addLog(d);
                if(d.type==='modules') updateModules(d.modules);
            };
            ws.onclose = ()=>setTimeout(connectWS,3000);
        }
        async function fetchData() {
            try {
                const [s,m,a,l] = await Promise.all([
                    fetch('/api/stats').then(r=>r.json()),
                    fetch('/api/modules').then(r=>r.json()),
                    fetch('/api/alerts?limit=5').then(r=>r.json()),
                    fetch('/api/logs?limit=20').then(r=>r.json())
                ]);
                updateStats(s); updateModules(m);
                a.forEach(addAlert); l.forEach(addLog);
            } catch(e) {
                document.getElementById('statusBadge').textContent='● OFFLINE';
                document.getElementById('statusBadge').style.color='var(--danger)';
            }
        }
        function updateStats(s) {
            document.getElementById('modulesActive').textContent=s.modules_active||0;
            document.getElementById('threatsToday').textContent=s.threats_today||0;
            document.getElementById('scansRun').textContent=s.scans_total||0;
            document.getElementById('uptime').textContent=s.uptime||'--';
        }
        function updateModules(modules) {
            const list = document.getElementById('moduleList');
            if(!modules||!modules.length) { list.innerHTML='<div class="module-item"><span class="module-name">No modules loaded</span></div>'; return; }
            list.innerHTML = modules.map(m=>'<div class="module-item"><span class="module-name">'+m.name+'</span><span class="module-status '+m.status+'">'+m.status+'</span></div>').join('');
        }
        function addAlert(a) {
            const list = document.getElementById('alertList');
            const e = document.createElement('div');
            e.className = 'log-entry '+(a.severity==='high'?'danger':a.severity==='medium'?'warn':'');
            e.innerHTML = '<div class="log-time">'+a.time+'</div>'+a.message;
            list.prepend(e);
            if(list.children>10) list.removeChild(list.lastChild);
        }
        function addLog(l) {
            const c = document.getElementById('logContainer');
            const e = document.createElement('div');
            e.className = 'log-entry';
            e.innerHTML = '<div class="log-time">'+l.time+'</div>'+l.message;
            c.prepend(e);
            if(c.children>50) c.removeChild(c.lastChild);
        }
        async function runScan(type) {
            const btn = event.target;
            btn.textContent='⏳ Scanning...'; btn.disabled=true;
            try {
                const r = await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type})});
                const d = await r.json();
                const el = document.getElementById('scanResults');
                el.innerHTML = '<div class="scan-result"><div class="title">'+d.title+'</div><div class="detail">'+d.summary+'</div></div>'+el.innerHTML;
            } catch(e) { alert('Scan failed'); }
            btn.textContent='▶ Run '+type.charAt(0).toUpperCase()+type.slice(1)+' Scan'; btn.disabled=false;
        }
        async function restartBackend() {
            if(!confirm('Restart backend?')) return;
            await fetch('/api/restart',{method:'POST'});
        }
        connectWS(); fetchData();
        setInterval(fetchData,15000);
    </script>
</body>
</html>
