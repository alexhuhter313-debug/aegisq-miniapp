version: '3.8'

services:
  miniapp:
    build: .
    container_name: aegisq-miniapp
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8001:8001"
    environment:
      - DETECTOR_URL=http://aegisq-detector:8000
      - BOT_TOKEN=${BOT_TOKEN:-}
      - ALLOWED_USER_ID=${ALLOWED_USER_ID:-0}
      - MINIAPP_URL=${MINIAPP_URL:-}
    networks:
      - aegisq-net

networks:
  aegisq-net:
    driver: bridge
